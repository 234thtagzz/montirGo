# Konfigurasi Supabase CLI untuk project MontirGo.
# `project_id` hanya identitas lokal; project ref remote diatur oleh `supabase link`.

project_id = "montirgo"

[functions.analyze-request]
verify_jwt = true

[functions.ai-assistant]
verify_jwt = true

[functions.xendit-create-payment]
verify_jwt = true

[functions.xendit-sync-payment]
verify_jwt = true

[functions.xendit-request-withdrawal]
verify_jwt = true

# Webhook Xendit tidak mengirim JWT Supabase; keamanan dijaga x-callback-token.
[functions.xendit-webhook]
verify_jwt = false

[functions.xendit-payout-webhook]
verify_jwt = false
