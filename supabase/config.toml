# Konfigurasi Supabase CLI untuk project MontirGo.
# `project_id` hanya identitas lokal; project ref remote diatur oleh `supabase link`.

project_id = "montirgo"

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[functions.analyze-request]
verify_jwt = true

[functions.ai-assistant]
verify_jwt = true

[functions.xendit-create-payment]
verify_jwt = true

[functions.xendit-sync-payment]
verify_jwt = true

[functions.xendit-request-withdrawal]
verify_jwt = true

[functions.xendit-sync-withdrawal]
verify_jwt = true

[functions.confirm-cash-payment]
verify_jwt = true

# Webhook Xendit & DB Webhook tidak mengirim JWT Supabase; keamanan dijaga header token/secret.
[functions.xendit-webhook]
verify_jwt = false

[functions.xendit-payout-webhook]
verify_jwt = false

[functions.send-push-notification]
verify_jwt = false
